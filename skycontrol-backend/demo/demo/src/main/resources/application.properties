# 1. Configuración de la conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_aeropuerto
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configuración de JPA / Hibernate
# 'update' hace que Spring cree o actualice las tablas automáticamente si algo cambia
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect